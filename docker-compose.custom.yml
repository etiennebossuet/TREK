services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trek
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=${TZ:-Europe/Paris}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}   # openssl rand -hex 32
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - APP_URL=https://trek.alterebo.fr         # URL publique — utilisée dans les liens e-mail (reset mot de passe, invitations…)
#      - TRUST_PROXY=1                        # décommenter derrière un reverse-proxy (Nginx, Caddy…)
#      - FORCE_HTTPS=true                     # décommenter si TLS terminé par le proxy
#      - ADMIN_EMAIL=admin@example.com        # compte admin créé uniquement au 1er démarrage
#      - ADMIN_PASSWORD=changeme
    volumes:
      # Données persistantes — chemins relatifs au docker-compose.custom.yml
      - ./server/data:/app/data       # SQLite (travel.db), logs, backups, clés JWT/chiffrement
      - ./server/uploads:/app/uploads # Photos, avatars, fichiers uploadés
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
